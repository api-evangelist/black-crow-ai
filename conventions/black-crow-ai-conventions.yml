generated: '2026-08-12'
method: probed
source: >-
  Live probes of https://api.blackcrow.ai/v1/events/* (2026-08-12), the first-party browser
  bundle https://init.blackcrow.ai/js/core/example.js (HTTP 200, 311,866 bytes decompressed),
  the Black Crow AI help center article "JavaScript"
  (https://blackcrow.zendesk.com/hc/en-us/articles/20203743583387-JavaScript), and the
  provider's own "Global API" integration page as captured on 2025-11-08
  (live URL https://www.blackcrow.ai/integrations/global-api now returns 404).
note: >-
  Black Crow AI ships no OpenAPI and no developer reference. Everything below was read off the
  running surface or off provider-authored pages. Where a convention is absent, that absence
  is recorded rather than filled in.
authentication:
  style: none (unauthenticated, site-identified ingest) + delegated platform credentials
  detail: see authentication/black-crow-ai-authentication.yml
transport:
  protocol: HTTPS only
  http_version: HTTP/2
  content_type_request: application/json
  content_type_response: text/plain (JSON body served under a text/plain content type)
  cors:
    allow_origin: '*'
    allow_methods: GET, POST, PUT
    allow_headers: Content-Type
    note: >-
      Fully open CORS with no credential header allowed through preflight — consistent with a
      browser-tag ingest endpoint rather than a server-to-server API.
  caching: 'Cache-Control: no-store, no-cache; Pragma: no-cache; Expires: 0'
  security_headers:
    strict_transport_security: max-age=63072000; includeSubDomains; preload
    x_frame_options: SAMEORIGIN
  server_timing: 'total;dur=<ms> returned on every response (observed total;dur=24)'
versioning:
  scheme: uri-path
  current: v1
  echoed_in_body: true
  detail: >-
    Every path is prefixed /v1/ and every response body echoes "version": "v1". No date-based
    version header, no version negotiation, no published version policy.
  docs: null
request_shape:
  event_ingest:
    method: POST
    path: /v1/events/{event_name}
    body: JSON object
    required_fields: [siteName, pageId, visitorId]
    note: >-
      Required fields confirmed by an empty-body POST, which returned three Validation Error
      102 entries naming exactly those fields. event_name is both a path segment and a body
      field (the tag sets body.event_name to match the path).
  platform_ingest:
    method: POST
    path: /v1/events/platform
    note: 'body carries event_name "platform", site_name, platform_event_names[], platform_event_id and a free-form data object'
event_names_observed:
- view
- view_response
- purchase
- delayed_purchase
- add_to_cart
- initiate_checkout
- identify
- scores_update
- overrides
