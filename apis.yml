apis:
- name: Black Crow AI Events API
  description: >-
    Live, versioned HTTP event-ingest API behind the Black Crow AI JavaScript tag. POST
    /v1/events/{event_name} accepts a JSON body identified by siteName, pageId and visitorId
    and carries the visit, purchase, cart, identity, score-update and Predictive Offer event
    families; POST /v1/events/platform carries partner-platform events. Unauthenticated and
    fully CORS-open, because it is called from the browser. A matching sandbox host runs at
    api.sandbox.blackcrow.ai. Black Crow AI publishes no OpenAPI and no developer reference
    for this surface — everything recorded here was probed live or read from the provider's
    own shipped bundle.
  humanURL: https://blackcrow.zendesk.com/hc/en-us/articles/20203743583387-JavaScript
  baseURL: https://api.blackcrow.ai/v1
