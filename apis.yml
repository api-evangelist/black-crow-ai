- name: Black Crow AI Global API
  description: >-
    Client-side JavaScript API exposed by the Black Crow AI tag as window.blackcrow. Brands
    push a binding ({app_name 'audience', bind 'scores_update', callback}) to receive Black
    Crow's real-time visitor prediction scores in a callback and forward them to any target
    platform with no turnkey integration, and push a {trigger 'extend', data} object to feed
    Black Crow additional page data after page load. Additional triggers cover set, start,
    session, refresh, partner_event and storefront_analytics, and the same events travel over
    postMessage for embedded surfaces. The provider's documentation page for this API now
    returns 404, but the mechanism is still present in the bundle served today.
  humanURL: https://blackcrow.zendesk.com/hc/en-us/articles/20203743583387-JavaScript
  baseURL: https://init.blackcrow.ai/js/core/
